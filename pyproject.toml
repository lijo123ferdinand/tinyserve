[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyserve"
version = "0.1.0"
description = "A vLLM-style LLM inference server built from scratch in numpy: paged KV cache, continuous batching, prefix caching, speculative decoding, OpenAI-compatible streaming."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Lijo Ferdinand", email = "lijoferdinand@gmail.com" }]
keywords = ["llm", "inference", "serving", "vllm", "paged-attention", "kv-cache", "speculative-decoding", "numpy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tinyserve = "tinyserve.cli:main"

[project.urls]
Repository = "https://github.com/lijo123ferdinand/tinyserve"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tinyserve = ["weights/*.npz", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
